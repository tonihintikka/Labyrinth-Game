<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth Game</title>
    <link rel="stylesheet" href="css/game.css">
    <style>
        .mode-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
        }
        .mode-button {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .mode-button:hover {
            background-color: #45a049;
        }
        .title {
            font-size: 2em;
            margin-bottom: 30px;
            text-align: center;
        }
        #level-editor-btn {
            display: none; /* Hidden by default, shown only for admins */
        }
    </style>
</head>
<body>
    <div class="mode-selection">
        <h1 class="title">Labyrinth Game</h1>
        <a href="/play.html" class="mode-button">Play Game</a>
        <a href="/plan.html" class="mode-button" id="level-editor-btn">Level Editor</a>
    </div>

    <script type="module">
        import AuthUI from './js/auth-ui.js';
        import AuthService from './js/AuthService.js';

        // Initialize authentication UI
        AuthUI.init();

        // Show/hide level editor button based on admin status
        AuthService.addAuthStateListener((authState) => {
            const editorBtn = document.getElementById('level-editor-btn');
            if (editorBtn) {
                editorBtn.style.display = authState.isAdmin ? 'block' : 'none';
            }
        });
    </script>
</body>
</html>
